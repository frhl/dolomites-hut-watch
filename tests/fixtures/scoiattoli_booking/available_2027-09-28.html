        <script type='text/javascript'>
        
        
        numPersone          = 2;
        postiSelezionati    = 0;

        $(document).ready(function(){
        
            aggiornaSelezione();

            $('.chk_id_camera,.sel_camerata').on('change',function(){
                
                aggiornaSelezione();

            });
            
            $('form').submit(function() {
            
            

                            if (postiSelezionati<numPersone) {
                                alert("Hai selezionato meno posti di quelli richiesti!");
                                return false;
                            }
                            
                            if (numCamereSelezionate>numPersone) {
                                alert("Non puoi selezionare più camere delle persone!");
                                return false;
                            }

                    
                
            });


        });
        
        aggiornaSelezione = function() {
        
            postiSelezionati        =   0;
            numCamereSelezionate    =   $('.chk_id_camera:checked').length;
            postiInCamerata         =   0;
            
            //cambio classe per la label delle stanze selezionate
            $('.chk_id_camera').parent('label').removeClass('selezionata');
            $('.chk_id_camera:checked').parent('label').addClass('selezionata');

            $('.chk_id_camera:checked').each(function() {
                postiSelezionati += Number( $(this).data('letti') );                
            });

            $('.sel_camerata').parent('label').removeClass('selezionata');
            
            $('.sel_camerata').each(function() {
                var valoreSelect    = Number( $(this).val() );
                postiSelezionati    += valoreSelect;
                postiInCamerata     += valoreSelect;
                if (valoreSelect) {
                    $(this).parent('label').addClass('selezionata');
                }
            });
            
            if (postiSelezionati==0) {
                $('#info').removeClass('utilizzato').html('');
                return;
            }

            stampa =    "<p>Hai selezionato <b>" + numCamereSelezionate + " camere</b> ";
            if (postiInCamerata>0)  stampa +=   " (e <b>" + postiInCamerata + " posti</b> in camerata) ";
            stampa +=   "per un totale di <b>" + postiSelezionati + " posti</b> su " + numPersone + "  richiesti.";
            
            if (postiSelezionati>numPersone) {
                stampa +=   "<br/>I letti non occupati avranno un costo di <b>15 &euro; per letto a notte</b>.";
            }

            $('#info').addClass('utilizzato').html(stampa);

            //console.log(postiSelezionati);

        };
        
    
        </script>
