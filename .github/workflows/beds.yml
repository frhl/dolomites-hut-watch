name: cancellation-watch

# Fast watch: beds for 2 on 22/23 June 2027 + Rifugio Nuvolau opening watch.
# Nuvolau also gets a 1-minute probe job around 1 Feb (nuvolau-dense.yml).
#
# Started by cron-job.org via workflow_dispatch (scripts/setup_triggers.py): every 15 min
# with scope=all, and every 5 min from 15 Dec to 15 Feb with scope=nuvolau. GitHub's own
# cron below is only a backup: in Nov 2026 it fired 3 of ~74 scheduled runs. A backup run
# that arrives within 10 min of an external one skips (hutwatch/fast.py).
on:
  schedule:
    - cron: "*/15 * * * *"   # backup only
  workflow_dispatch:
    inputs:
      scope:
        description: "all = every hut; nuvolau = Nuvolau checks only (the extra 5-min ticks)"
        type: choice
        options: [all, nuvolau]
        default: all
      test_alert:
        description: "Send test pushes (ANNOUNCEMENT, OPENING, BEDS) + a TEST issue"
        type: boolean
        default: false

# Public logs show only "checked <hut>: ok|FAIL"; state goes to the private state repo.
# This workflow never commits to the public repo.
permissions:
  contents: read
  issues: write     # alert record
  actions: write    # self-disable once no night is left to watch

concurrency:
  group: cancellation-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out private state repo
        uses: actions/checkout@v4
        with:
          repository: frhl/dolomites-hut-watch-state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: private
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Check availability
        id: beds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert }}
          SCHEDULE: ${{ github.event.schedule }}
          SCOPE: ${{ inputs.scope }}
          HUTWATCH_PUBLIC_LOG: "1"
          HUTWATCH_ISSUES: ${{ vars.HUTWATCH_ISSUES }}
        run: python -m hutwatch fast
      - name: Commit private state
        if: always()
        run: scripts/commit_state.sh private "cancellation-watch $(date -u +%FT%TZ)" state
      - name: Disable when every night is booked or past
        if: steps.beds.outputs.all_done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable beds.yml -R "$GITHUB_REPOSITORY"
