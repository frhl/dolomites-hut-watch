name: page-watch

# Slow watch: 28 June 2027 huts (bookings opening) + change-watch fallbacks.
# Started every 4 h by cron-job.org via workflow_dispatch (scripts/setup_triggers.py).
# GitHub's own cron is a backup (it fires late or not at all); a backup run within 3.5 h
# of the last run skips the checks but still refreshes STATUS.md (keep-alive).
on:
  schedule:
    - cron: "17 */4 * * *"   # backup only
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert (ntfy + GitHub issue/Telegram if configured)"
        type: boolean
        default: false

# Logs of this public repo are public: only "checked <x>: ok|FAIL" lines are printed.
# Results and page text go to the private state repo; the only public commit is the
# generated STATUS.md (run times + OK/FAILING), which also keeps the schedules alive.
permissions:
  contents: write   # public STATUS.md keep-alive commit
  issues: write     # alerts
  actions: write    # self-disable after 2027-06-28

concurrency:
  group: page-watch
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      expired: ${{ steps.date.outputs.expired }}
    steps:
      - id: date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Europe/Rome date +%F)
          if [[ "$today" > "2027-06-28" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "Past 2027-06-28: disabling this workflow."
            gh workflow disable pages.yml -R "$GITHUB_REPOSITORY" || true
          fi

  check:
    needs: guard
    if: needs.guard.outputs.expired != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out private state repo
        uses: actions/checkout@v4
        with:
          repository: frhl/dolomites-hut-watch-state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: private
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Check pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert }}
          SCHEDULE: ${{ github.event.schedule }}
          HUTWATCH_PUBLIC_LOG: "1"
          HUTWATCH_ISSUES: ${{ vars.HUTWATCH_ISSUES }}
        run: python -m hutwatch pages
      - name: Commit private state
        if: always()
        run: scripts/commit_state.sh private "page-watch $(date -u +%FT%TZ)" state
      - name: Public status (keep-alive)
        if: always()
        env:
          HUTWATCH_PUBLIC_LOG: "1"
        run: |
          python -m hutwatch status
          scripts/commit_state.sh . "status $(date -u +%FT%TZ)" STATUS.md
